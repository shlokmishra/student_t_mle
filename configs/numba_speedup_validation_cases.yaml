defaults:
  num_iterations: 60000
  warmup_iterations: 500
  seeds: [0, 1, 2]
  repeats: 2
  backends: [jax_loop, jax_scan, numba]
  n_values: [10, 20, 50]
  k_values: [1, 2, 3]
  max_parallel: 12

smoke:
  num_iterations: 200
  warmup_iterations: 20
  seeds: [0]
  repeats: 1
  backends: [jax_loop, jax_scan, numba]
  n_values: [10]
  k_values: [2]
  max_parallel: 3

runset:
  name: numba_speedup_validation
  output_dir: results/numba_speedup_validation
  logs_dir: logs/numba_speedup_validation
