defaults:
  num_iterations: 30000
  burn_in: 5000
  repeats: 3
  seeds: [0, 1, 2]
  initializations: [central]

cases:
  - case_id: student_t_k1_n20
    model: student_t
    k: 1
    n: 20
    methods: [gibbs, rattle]
  - case_id: student_t_k2_n20
    model: student_t
    k: 2
    n: 20
    methods: [gibbs, rattle]
  - case_id: student_t_k3_n20
    model: student_t
    k: 3
    n: 20
    methods: [gibbs, rattle]
  - case_id: logistic_n20
    model: logistic
    k:
    n: 20
    methods: [gibbs, rattle]
